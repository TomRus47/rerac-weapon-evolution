; Weapon Evolution is an unofficial mod by TomRus47 for ReRAC 0.3.8-alpha.
; The mod author does not own the original Ratchet & Clank games or assets
; and does not develop the original games or ReRAC. Original-game rights
; remain with their respective rights holders. See docs/mod/CREDITS.md.

; ReRAC Weapon Evolution - international default configuration
; Only the real-HP damage system is supported: 1 native HP = 100 HP.
; damage_hp is damage per projectile/explosion; damage_per_second is HP/s.
; Separate attack instances can damage an enemy immediately; each hits it once.
; Only HP actually removed from eligible enemies awards XP. Overkill gives no extra XP.
; XP thresholds apply separately to each transition, not as cumulative totals.
; ammo_interval_ticks and damage_interval_ticks are independent, per grade.
; 60 game ticks = 1 second, independently of rendering FPS.
; Stream damage accumulates only on actual contact and is registered every N contact ticks.
; gold_effects enables original Gold mechanics; gold_texture controls appearance only.
; Colors: default = original, or RRGGBB / #RRGGBB for custom RGB.
; In-game weapon names always follow the selected game language.
; name_opacity_percent controls the HUD weapon name, grade and their background.
; 100 = normal, 50 = semi-transparent, 0 = hidden; it does not affect the 3D model.
; The XP bar follows the ammo panel fade and stays aligned with its outer edges.
; xp_bar_horizontal_inset_px affects the name position, not the XP bar span.
; Taunter wave_* settings affect visuals only, not attraction, damage or stun.
; wave_alpha: 0..128. Wave interval: 1..600 ticks. Wave multipliers: 0.1..8.
; Devastator visual explosion size is independent of its damage radius.
; Morph-o-Ray fire_in_air is per grade; running fire is always allowed.
; Walloper air_dash_enabled controls airborne dashes at each grade.
; Close the launcher before editing this file manually, then reopen it.
; The launcher loads weapons.ini at every startup. Named presets are optional.
; Save and launch uses these values directly when nothing has been edited.

[general]
refill_ammo_on_upgrade = true
xp_per_damage = 0.12


; Ammo-Survival Mode
; New games start with zero bombs. Existing save ammo is preserved.
; Unlock thresholds count collected normal bolts; they do not spend currency.
; Ammo chance inputs are normalized together to 100%. 0 excludes a type.
ngplus_multiplier = 1.25
enemy_health_multiplier = 1
enemy_health_include_bosses = true
enemy_damage_by_health = true
enemy_damage_multiplier = 1
enemy_speed_multiplier = 1
enemy_projectile_range_multiplier = 1
enemy_projectile_speed_multiplier = 1
enemy_perception_multiplier = 1
enemy_chase_range_multiplier = 1
extra_enemies_per_level = 0
extra_enemy_prefer_small = true
extra_enemy_prefer_medium = true
extra_enemy_prefer_large = true
nanotech_xp_per_upgrade = 4000
nanotech_progression_max_health = 26
nanotech_upgrade_sound = true
nanotech_random_healing = true
; Total extra enemies per visit, not per original. Only selected categories are eligible. Unsafe additions remain pending; no overlapping placements.
; Duplicate small enemies (up to 100 base HP). Categories use original HP before all multipliers; unselected categories never spawn.
; Duplicate medium enemies (over 100, up to 200 base HP). Categories use original HP before all multipliers; unselected categories never spawn.
; Duplicate large enemies (over 200 base HP). Categories use original HP before all multipliers; unselected categories never spawn.
; Enables Nanotech XP progression and ordinary enemy damage based on original HP, without a 3-HP cap. Boss attacks use their individual configured rules; environmental hazards stay native.
; 0.1-100. Multiplies enemy damage, including the attack-specific boss values, rounded to at least 1 HP.


