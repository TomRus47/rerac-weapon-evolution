name: Build unpublished runtime-upgrade draft

on:
  push:
    branches: [main]
    paths: [mod/draft.json]

permissions:
  contents: read

concurrency:
  group: weapon-evolution-unpublished-draft
  # Only unpublished candidates use this group. Newer corrected source wins.
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install validated Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.1
          exit $LASTEXITCODE
      - name: Test source and build the player package
        shell: cmd
        run: |
          call tools\mod\setup_msvc.bat
          if errorlevel 1 exit /b 1
          python tools\mod\check_source.py
          if errorlevel 1 exit /b 1
          python -m unittest discover -s launcher\tests -v
          if errorlevel 1 exit /b 1
          cargo test --release --locked --no-default-features -p rc-formats --lib
          if errorlevel 1 exit /b 1
          python launcher\editabile.py build
          if errorlevel 1 exit /b 1
          python tools\mod\draft_release.py package
          exit /b %ERRORLEVEL%
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-draft-windows
          path: |
            launcher/dist/*.zip
            launcher/dist/*.sha256
            launcher/dist/release-build.json
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unpublished-draft-windows
          path: release-assets
      - name: Attach verified Windows and exact source archives to a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/mod/draft_release.py upload --assets release-assets
