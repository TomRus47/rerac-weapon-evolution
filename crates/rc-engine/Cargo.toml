[package]
name = "rc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faithful reimplementation runtime for Ratchet & Clank (PS2) on Bevy."

# The runtime executable is `rerac` (launcher contract); the crate stays `rc-engine` (`cargo dev`, `-p rc-engine`).
[[bin]]
name = "rerac"
path = "src/main.rs"

[features]
# `cargo run -p rc-engine --features dev` links Bevy as a dynamic library: seconds, not minutes, per rebuild.
dev = ["bevy/dynamic_linking"]
weapon-evo-release = ["rc-game/weapon-evo-release"]

[dependencies]
bevy = "0.19"
rc-formats = { path = "../rc-formats" }
rc-game = { path = "../rc-game" }
# Official ReRAC 0.3.6 Going Commando logic.
rc-game2 = { path = "../rc-game2" }
# Decompressed lumps through the Tier 1 engine cache (once per process).
rc-data = { path = "../rc-data" }
# The movies (FMV): MPEG-2 video decoder and PSS player core, ours (docs/formats/pss.md).
rc-video = { path = "../rc-video" }
anyhow.workspace = true
